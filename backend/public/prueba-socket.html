<!doctype html>
<!--
  Socket.IO test page.

  Open http://localhost:3000/prueba-socket.html while the server is running.
  It shows the connection status and lists every `turno_creado` and
  `turno_actualizado` event as it arrives (newest first).
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Prueba Socket.IO</title>
</head>
<body>
  <h1>Prueba de WebSockets</h1>
  <p id="estado">Conectando...</p>
  <ul id="eventos"></ul>

  <!-- Client library served automatically by the Socket.IO server. -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    // Connects to the same host that served this page.
    const socket = io();
    const estado = document.getElementById('estado');
    const lista = document.getElementById('eventos');

    /**
     * Adds a timestamped line to the top of the event list.
     * @param {string} texto - Text to display.
     */
    function agregar(texto) {
      const li = document.createElement('li');
      li.textContent = new Date().toLocaleTimeString() + ' - ' + texto;
      lista.prepend(li);
    }

    socket.on('connect', () => {
      estado.textContent = 'Conectado (' + socket.id + ')';
      estado.style.color = 'green';
    });

    socket.on('disconnect', () => {
      estado.textContent = 'Desconectado, reconectando...';
      estado.style.color = 'red';
    });

    socket.on('turno_creado', (t) => {
      agregar('turno_creado: #' + t.numero + ' ' + t.cliente);
    });

    socket.on('turno_actualizado', (t) => {
      agregar('turno_actualizado: #' + t.numero + ' -> ' + t.estado + ' (' + (t.funcionario ?? '') + ')');
    });
  </script>
</body>
</html>
